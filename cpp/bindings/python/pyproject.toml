[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "katmer-native"
version = "0.1.0"
description = "Python ctypes binding for the Katmer native core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Katmer Contributors" }]

[tool.setuptools.packages.find]
where = ["."]
